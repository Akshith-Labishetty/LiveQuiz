<!DOCTYPE html>
<html>

<head>
  <title>Teacher Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    .btn {
      width: 160px;
      padding: 12px;
      margin: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }

    .btn:hover {
      background-color: #45a049;
    }

    .btn-logout {
      background: #e63946;
    }

    .btn-logout:hover {
      background: #d62828;
    }

    html,
    body {
      overflow-x: hidden;
    }
  </style>
</head>

<body>
  <div class="navbar">
    <div class="nav-title">LiveQuiz+</div>
    <button class="btn-back" onclick="goBack()">⬅ Back</button>
  </div>

  <div class="dashboard-container">
    <h1>Teacher Dashboard</h1>
    <p id="welcomeText"></p>

    <button class="btn" onclick="window.open('quiz.html', '_blank')">Add Quiz</button>
    <button class="btn" onclick="window.location.href='poll.html'" style="background: #667eea;">Add Poll</button>

    <button class="btn" onclick="window.open('analytics.html', '_blank')" style="background:#667eea;">📊
      Analytics</button>
    <button class="btn-logout" onclick="logout()">Logout</button>

    <h3>Live Student Results</h3>
    <div id="results"></div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    const userName = localStorage.getItem("name");

    document.getElementById("welcomeText").innerText = "Welcome " + (userName || "") + "!";

    if (!token) { alert("Login first!"); window.location.href = "index.html"; }
    if (role !== "teacher") { alert("Students are not allowed."); window.location.href = "student.html"; }

    const socket = io("http://localhost:4000");
    socket.on("teacherView", (data) => {
      const container = document.getElementById("results");
      const id = "stu-" + data.studentName.replace(/\s+/g, "_");

      let existing = document.getElementById(id);

      if (existing) {
        // Update score without creating duplicate
        existing.innerHTML = `${data.studentName} → <b>${data.score}/${data.total}</b>`;
      } else {
        // Add new student entry
        const div = document.createElement("div");
        div.id = id;
        div.innerHTML = `${data.studentName} → <b>${data.score}/${data.total}</b>`;
        container.prepend(div);
      }
    });

    function logout() { localStorage.clear(); window.location.href = "index.html"; }
    function goBack() { window.history.back(); }
  </script>

  <script src="theme.js"></script>

</body>

</html>
