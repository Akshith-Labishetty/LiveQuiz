<!DOCTYPE html>
<html>

<head>
    <title>Create Poll - LiveQuiz</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
        .poll-form {
            max-width: 700px;
            margin: 30px auto;
            text-align: left;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-create {
            background: linear-gradient(90deg, #667eea, #764ba2);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 10px;
            transition: transform 0.2s;
        }

        .btn-create:hover {
            transform: translateY(-2px);
        }

        .btn-cancel {
            background: #e63946;
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-cancel:hover {
            transform: translateY(-2px);
        }

        html,
        body {
            overflow-x: hidden;
        }
    </style>
</head>

<body>
    <div class="navbar">
        <div class="nav-title">LiveQuiz+ | Create Poll</div>
        <button class="btn-back" onclick="goBack()">⬅ Back</button>
    </div>

    <div class="dashboard-container poll-form">
        <h1 style="color: var(--accent2);">📊 Create New Poll</h1>
        <p style="margin-bottom: 30px;">Enter a poll question and provide four options (A, B, C, D).</p>

        <form id="pollForm">
            <div class="form-group">
                <label for="question">Poll Question</label>
                <input type="text" id="question" name="question"
                    placeholder="Enter Your Poll Question Here" required>
            </div>

            <div class="form-group">
                <label for="optionA">Option A</label>
                <input type="text" id="optionA" name="optionA" placeholder="A" required>
            </div>

            <div class="form-group">
                <label for="optionB">Option B</label>
                <input type="text" id="optionB" name="optionB" placeholder="B" required>
            </div>

            <div class="form-group">
                <label for="optionC">Option C</label>
                <input type="text" id="optionC" name="optionC" placeholder="C" required>
            </div>

            <div class="form-group">
                <label for="optionD">Option D</label>
                <input type="text" id="optionD" name="optionD" placeholder="D" required>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button type="submit" class="btn-create">✅ Create Poll</button>
                <button type="button" class="btn-cancel" onclick="goBack()">Cancel</button>
            </div>
        </form>
    </div>

    <script src="theme.js"></script>
    <script src="poll.js"></script>
</body>

</html>
