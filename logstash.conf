# Logstash Configuration for LiveQuiz
# This pipeline reads JSON logs from file and sends them to Elasticsearch

# INPUT: Read logs from the application log file
input {
  # File input plugin - reads from log files
  file {
    # Path to the log file(s) - supports wildcards
    path => "/usr/share/logstash/logs/app.log"
    
    # Start reading from the beginning of the file
    start_position => "beginning"
    
    # Use sincedb to track which parts of the file have been read
    sincedb_path => "/usr/share/logstash/sincedb/livequiz.sincedb"
    
    # Codec for JSON logs
    codec => "json"
    
    # Type tag for easier filtering
    type => "livequiz-app"
    
    # Add tags
    tags => ["livequiz", "backend", "nodejs"]
  }
  
  # Optional: TCP input for direct log shipping (alternative to file input)
  # Uncomment this if you want to ship logs directly via TCP instead of files
  # tcp {
  #   port => 5000
  #   codec => json_lines
  #   type => "livequiz-app"
  #   tags => ["livequiz", "backend", "nodejs", "tcp"]
  # }
}

# FILTER: Parse and enrich log data
filter {
  # Only process logs of type livequiz-app
  if [type] == "livequiz-app" {
    
    # Parse JSON if not already parsed
    if [message] {
      json {
        source => "message"
        target => "parsed"
        skip_on_invalid_json => true
      }
      
      # Move parsed fields to root level
      if [parsed] {
        ruby {
          code => "
            parsed = event.get('parsed')
            if parsed.is_a?(Hash)
              parsed.each { |k, v| event.set(k, v) }
            end
            event.remove('parsed')
          "
        }
      }
    }
    
    # Parse timestamp if present
    if [timestamp] {
      date {
        match => ["timestamp", "yyyy-MM-dd HH:mm:ss", "ISO8601"]
        target => "@timestamp"
        remove_field => ["timestamp"]
      }
    }
    
    # Add severity level mapping
    if [level] {
      mutate {
        add_field => { "severity" => "%{level}" }
      }
    }
    
    # Geoip enrichment if IP address is present
    if [metadata][ip] {
      geoip {
        source => "[metadata][ip]"
        target => "geoip"
      }
    }
    
    # Add host information
    mutate {
      add_field => { 
        "application" => "livequiz"
        "environment" => "${ENVIRONMENT:development}"
      }
    }
    
    # Remove unnecessary fields to reduce storage
    mutate {
      remove_field => ["host", "path", "tags"]
    }
  }
}

# OUTPUT: Send processed logs to destinations
output {
  # Send to Elasticsearch
  if [type] == "livequiz-app" {
    elasticsearch {
      # Elasticsearch host
      hosts => ["elasticsearch:9200"]
      
      # Index pattern - creates daily indices
      index => "livequiz-logs-%{+YYYY.MM.dd}"
      
      # Document ID (optional, auto-generated if not specified)
      # document_id => "%{[@metadata][fingerprint]}"
      
      # Template for index mapping
      template_name => "livequiz-logs"
      template_overwrite => true
      
      # Retry failed insertions
      retry_on_conflict => 5
    }
  }
  
  # Optional: Output to stdout for debugging
  # Useful during development to see what's being processed
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
  
  # Optional: Dead letter queue for failed events
  # Uncomment if you want to capture events that fail processing
  # file {
  #   path => "/usr/share/logstash/dead_letter_queue/failed_events_%{+YYYY_MM_dd}.log"
  #   codec => json_lines
  # }
}
