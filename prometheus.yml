# Prometheus Configuration for LiveQuiz
# This file configures how Prometheus scrapes metrics from the application

# Global configuration
global:
  # How frequently to scrape targets
  scrape_interval: 15s
  
  # How long until a scrape request times out
  scrape_timeout: 10s
  
  # How frequently to evaluate rules
  evaluation_interval: 15s
  
  # Attach these labels to any time series or alerts when communicating with
  # external systems (federation, remote storage, Alertmanager)
  external_labels:
    monitor: 'livequiz-monitor'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - 'alertmanager:9093'

# Load rules once and periodically evaluate them according to the global 'evaluation_interval'
# rule_files:
#   - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # LiveQuiz Backend Application
  - job_name: 'livequiz-backend'
    # Override global scrape interval for this job
    scrape_interval: 10s
    scrape_timeout: 5s
    
    # Metrics path (default is /metrics)
    metrics_path: '/metrics'
    
    # HTTP scheme (http or https)
    scheme: 'http'
    
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: 'livequiz'
          component: 'backend'
          app: 'nodejs'
    
    # Optional: Add basic auth if you secure the /metrics endpoint
    # basic_auth:
    #   username: 'prometheus'
    #   password: 'your-secure-password'
    
    # Relabeling for better metric organization
    metric_relabel_configs:
      # Add instance label
      - source_labels: [__address__]
        target_label: instance
        
      # Drop metrics you don't need (example)
      # - source_labels: [__name__]
      #   regex: 'go_.*'
      #   action: drop

# Storage configuration
# storage:
#   tsdb:
#     path: /prometheus
#     retention:
#       time: 15d
#       size: 50GB
